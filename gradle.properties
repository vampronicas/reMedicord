# Memory-friendly settings: this PC currently has a very small Windows page file, so Java can't
# reserve much memory. Raise to -Xmx3g / workers 2 once the page file is "System managed".
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -Xss512k -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
